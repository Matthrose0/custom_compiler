# built-in-Macros and Instruction Maps

macros:
  # stack macros
  innit.stack:
    params: []
    body: |
      SP = 0x40 # = 64
      # condition -> sp2 = 0
  getconst:
    params: [address_LO, reg]
    body: |
      LO = address_LO
      HI = 0
      reg = M
  push.D:
    params: []
    body: |
      LO = SP
      getconst()
  
  JUMP_TO:
    params: [addressA, addressB]
    body: |
      LO = addressA
      HI = addressB;JMP


instruction_maps:
  saveAddress_map:
    'LO'       : '001'
    'HI'       : '010'
    'M'        : '011'
    'SP'       : '100'
    'A'        : '101'
    'D'        : '110'
    
    'SERIALIZE': '111'
    'O'        : '111'
    
  jump_map:
    # 'Never':'0000'
    'JLT' : '0001'  # Jump if < 0
    'JEQ' : '0010'  # = 0
    'JGT' : '0011'  # > 0
    'C'   : '0100'  # Carry
    'NOV' : '0101'  # Negative Overflow
    'POV' : '0110'  # Positive Overflow
    'OVF' : '0111'  # any Overflow
    'JMP' : '1000'  # Jump always
    'JGE' : '1001'  # >=0
    'JNE' : '1010'  # !=0
    'JLE' : '1011'  # <=0
    'NC'  : '1100'  # No Carry
    'NNOV': '1101'  # No Negative Overflow
    'NPOV': '1110'  # No Positive Overflow
    'NOVF': '1111'  # No Overflow

  alu_map:
    # '='    : '0000'
    'ZMSB' : '0001'
    '+'    : '0100'
    '-'    : '0110' # X - Y   |   - Y
    'INC'  : '0101'
    'DEC'  : '0111'
    '&'    : '1100' # X and Y
    '|'    : '1101' # X or Y
    '^'    : '1110' # X xor Y
    '!'    : '1111' # not X
    'SHL'  : '1000'
    'SHR'  : '1001'
    'MAX'  : '1010'
    'MIN'  : '0010'
    'LSHR' : '1011'
    # '' : '0011'
  single_op:
    - '!'
    - '-'
    - 'INC'
    - 'DEC'
    - 'SHL'
    - 'SHR'
    - 'LSHR'
  
  input_reg_map:
    'A,D'   : '0000'
    'A,SP'  : '0001'
    'A,M'   : '0010'
    'A,P'   : '0011'
    'A,LO'  : '0100'
    'A,HI'  : '0101'
    'D,M'   : '0110'
    'D,SP'  : '0111'
    # swaped
    'D,A'   : '1000'
    'SP,A'  : '1001'
    'M,A'   : '1010'
    'P,A'   : '1011'
    'LO,A'  : '1100'
    'HI,A'  : '1101'
    'M,D'   : '1110'
    'SP,D'  : '1111'
